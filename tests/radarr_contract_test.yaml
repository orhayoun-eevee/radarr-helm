suite: radarr chart contract
templates:
  - templates/all.yaml
tests:
  - it: renders expected default resource set and ingress host
    asserts:
      - hasDocuments:
          count: 15
      - documentSelector:
          path: metadata.name
          value: radarr-route
        equal:
          path: spec.hostnames[0]
          value: radarr-k8s.orhayoun.com
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/instance"]
          value: prometheus
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/name"]
          value: grafana
      - documentSelector:
          path: kind
          value: ServiceMonitor
        exists:
          path: metadata.name
      - documentSelector:
          path: kind
          value: DestinationRule
        equal:
          path: spec.host
          value: radarr-http

  - it: wires radarr application container security and pvc correctly
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].name
          value: radarr
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1013
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1011
      - documentSelector:
          path: kind
          value: PersistentVolumeClaim
        equal:
          path: metadata.name
          value: radarr-config

  - it: keeps minimal scenario render compact and deterministic
    values:
      - scenarios/minimal.yaml
    asserts:
      - hasDocuments:
          count: 5

  - it: disables destination rule when explicitly turned off
    set:
      network:
        istio:
          destinationRule:
            enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: applies grafana instance selector overrides from values
    set:
      metrics:
        grafana:
          instanceSelector:
            matchLabels:
              app.kubernetes.io/instance: observability
              app.kubernetes.io/name: grafana-primary
    asserts:
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/instance"]
          value: observability
      - documentSelector:
          path: kind
          value: GrafanaDashboard
        equal:
          path: spec.instanceSelector.matchLabels["app.kubernetes.io/name"]
          value: grafana-primary

  - it: disables serviceMonitor when explicitly turned off
    set:
      metrics:
        serviceMonitor:
          enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: applies httproute host override
    set:
      network:
        httpRoute:
          host: radarr.example.internal
    asserts:
      - documentSelector:
          path: metadata.name
          value: radarr-route
        equal:
          path: spec.hostnames[0]
          value: radarr.example.internal

  - it: applies destination rule host override
    set:
      network:
        istio:
          destinationRule:
            host: radarr-custom-http
    asserts:
      - documentSelector:
          path: kind
          value: DestinationRule
        equal:
          path: spec.host
          value: radarr-custom-http

  - it: disables grafana dashboard resources when grafana is disabled
    set:
      metrics:
        grafana:
          enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: applies explicit radarr image override for controlled rollouts
    set:
      workload:
        spec:
          containers:
            radarr:
              image:
                repository: registry.internal/radarr
                tag: ci-test
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].image
          value: registry.internal/radarr:ci-test

  - it: keeps radarr networking and health probes wired to stable defaults
    asserts:
      - documentSelector:
          path: metadata.name
          value: radarr-http
        equal:
          path: spec.ports[0].port
          value: 8080
      - documentSelector:
          path: metadata.name
          value: radarr-metrics
        equal:
          path: spec.ports[0].targetPort
          value: metrics
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /ping
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ping
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: radarr-config
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
